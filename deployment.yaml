
apiVersion: apps/v1

kind: Deployment

metadata:

name: chatbot

spec:

replicas: 1

selector:

matchLabels:

app: chatbot

template:

metadata:

labels:

app: chatbot

spec:

containers:

- name: web

image: jiangjinyoung/chatbot:latest

ports:

- containerPort: 5000

---

apiVersion: v1

kind: Service

metadata:

name: chatbot

spec:

type: NodePort

selector:

app: chatbot

ports:

- port: 80

targetPort: 5000

